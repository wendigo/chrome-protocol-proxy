<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chrome-protocol-proxy</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-alt: #161b22;
    --border: #30363d;
    --fg: #c9d1d9;
    --fg-dim: #8b949e;
    --request: #79c0ff;
    --response: #ff7b72;
    --event: #7ee787;
    --error: #ffa198;
    --injected: #d2a8ff;
    --accent: #58a6ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 12px/1.5 "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: var(--bg-alt);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  header h1 { font-size: 13px; margin: 0; font-weight: 600; }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--response);
    display: inline-block;
  }

  #status-dot.connected { background: var(--event); }

  input[type=text], textarea, select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 4px;
    padding: 4px 6px;
    font: inherit;
  }

  input[type=text]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 4px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }

  button:hover { border-color: var(--fg-dim); }
  button.active { border-color: var(--accent); color: var(--accent); }

  label.check {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    color: var(--fg-dim);
    user-select: none;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  #toolbar input { min-width: 160px; }

  #frames-container { flex: 1; overflow: auto; }

  table { width: 100%; border-collapse: collapse; }

  td {
    padding: 2px 8px;
    vertical-align: top;
    border-bottom: 1px solid #1b212b;
    white-space: nowrap;
  }

  td.payload {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 0;
    width: 100%;
    color: var(--fg-dim);
  }

  tr.frame { cursor: pointer; }
  tr.frame:hover td { background: var(--bg-alt); }

  .time { color: var(--fg-dim); }
  .conn { color: var(--fg-dim); }
  .session { color: var(--fg-dim); }

  .method-request { color: var(--request); }
  .method-response { color: var(--response); }
  .method-event { color: var(--event); }
  .method-error { color: var(--error); }

  .dir { color: var(--fg-dim); }

  .badge {
    display: inline-block;
    border-radius: 3px;
    padding: 0 4px;
    font-size: 10px;
    margin-left: 4px;
    vertical-align: 1px;
  }

  .badge-injected { background: #3b2a53; color: var(--injected); }
  .badge-error { background: #58211d; color: var(--error); }

  tr.details td {
    background: var(--bg-alt);
    white-space: pre-wrap;
  }

  tr.details pre {
    margin: 4px 0;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 320px;
    overflow: auto;
  }

  tr.details .actions { margin-bottom: 4px; }

  #command-panel {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
    align-items: flex-start;
    flex-wrap: wrap;
  }

  #command-panel select { max-width: 260px; }
  #cmd-method { width: 220px; }
  #cmd-session { width: 180px; }
  #cmd-params { flex: 1; min-width: 240px; height: 28px; resize: vertical; }

  #statusbar {
    display: flex;
    gap: 16px;
    padding: 4px 12px;
    border-top: 1px solid var(--border);
    color: var(--fg-dim);
    font-size: 11px;
  }

  #toast {
    position: fixed;
    bottom: 90px;
    right: 16px;
    background: #58211d;
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 4px;
    padding: 6px 12px;
    display: none;
    max-width: 50vw;
  }
</style>
</head>
<body>
  <header>
    <span id="status-dot"></span>
    <h1>chrome-protocol-proxy</h1>
    <span id="conn-summary" class="conn">no proxied connections</span>
  </header>

  <div id="toolbar">
    <input type="text" id="search" placeholder="search...">
    <input type="text" id="include" placeholder="include (comma separated)">
    <input type="text" id="exclude" placeholder="exclude (comma separated)">
    <label class="check"><input type="checkbox" id="show-requests" checked> requests</label>
    <label class="check"><input type="checkbox" id="show-responses" checked> responses</label>
    <label class="check"><input type="checkbox" id="show-events" checked> events</label>
    <label class="check"><input type="checkbox" id="show-injected" checked> injected</label>
    <button id="pause">pause</button>
    <button id="clear">clear</button>
    <button id="autoscroll" class="active">autoscroll</button>
  </div>

  <div id="frames-container">
    <table><tbody id="frames"></tbody></table>
  </div>

  <div id="command-panel">
    <select id="cmd-conn"></select>
    <input type="text" id="cmd-session" list="sessions" placeholder="sessionId (optional)">
    <datalist id="sessions"></datalist>
    <input type="text" id="cmd-method" placeholder="method, e.g. Page.navigate">
    <textarea id="cmd-params" placeholder='params JSON, e.g. {"url": "https://example.com"}' spellcheck="false"></textarea>
    <button id="cmd-send">send</button>
  </div>

  <div id="statusbar">
    <span id="count"></span>
    <span id="ws-status">connecting...</span>
  </div>

  <div id="toast"></div>

<script>
(function() {
  "use strict";

  var MAX_FRAMES = 3000;

  var state = {
    frames: [],
    conns: [],
    pending: {},   // connId|sessionId|id -> request method
    sessions: {},  // sessionId -> true
    paused: false,
    autoscroll: true,
    dirty: false
  };

  var el = function(id) { return document.getElementById(id); };
  var framesBody = el("frames");
  var container = el("frames-container");

  function classify(m) {
    if (m.method && m.id) return "request";
    if (m.method) return "event";
    if (m.error) return "error";
    return "response";
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    var pad = function(n, w) { return String(n).padStart(w, "0"); };
    return pad(d.getHours(), 2) + ":" + pad(d.getMinutes(), 2) + ":" +
           pad(d.getSeconds(), 2) + "." + pad(d.getMilliseconds(), 3);
  }

  function shorten(s, n) {
    if (!s) return "";
    return s.length > n ? s.slice(0, n) + "…" : s;
  }

  function prepare(frame) {
    var m = frame.message;
    frame.kind = classify(m);
    frame.rawText = JSON.stringify(m);
    frame.searchText = frame.rawText.toLowerCase();

    var sessionId = m.sessionId || (m.params && m.params.sessionId) || "";
    frame.sessionId = sessionId;

    if (sessionId) {
      if (!state.sessions[sessionId]) {
        state.sessions[sessionId] = true;
        var opt = document.createElement("option");
        opt.value = sessionId;
        el("sessions").appendChild(opt);
      }
    }

    if (frame.kind === "request") {
      state.pending[frame.connId + "|" + sessionId + "|" + m.id] = m.method;
      frame.label = m.method + " (" + m.id + ")";
    } else if (frame.kind === "event") {
      frame.label = m.method;
    } else {
      var key = frame.connId + "|" + sessionId + "|" + m.id;
      var method = state.pending[key];
      delete state.pending[key];
      frame.label = (method || "?") + "* (" + m.id + ")";
    }

    return frame;
  }

  function parseList(value) {
    return value.split(",").map(function(s) { return s.trim(); }).filter(Boolean);
  }

  function matches(frame) {
    if (frame.kind === "request" && !el("show-requests").checked) return false;
    if ((frame.kind === "response" || frame.kind === "error") && !el("show-responses").checked) return false;
    if (frame.kind === "event" && !el("show-events").checked) return false;
    if (frame.injected && !el("show-injected").checked) return false;

    var search = el("search").value.trim().toLowerCase();
    if (search && frame.searchText.indexOf(search) === -1) return false;

    var text = (frame.label || "") + frame.rawText;
    var excludes = parseList(el("exclude").value);
    for (var i = 0; i < excludes.length; i++) {
      if (text.indexOf(excludes[i]) !== -1) return false;
    }

    var includes = parseList(el("include").value);
    if (includes.length === 0) return true;
    for (var j = 0; j < includes.length; j++) {
      if (text.indexOf(includes[j]) !== -1) return true;
    }

    return false;
  }

  function rowFor(frame, index) {
    var tr = document.createElement("tr");
    tr.className = "frame";
    tr.dataset.index = index;

    var badge = frame.injected ? '<span class="badge badge-injected">injected</span>' : "";
    if (frame.kind === "error") badge += '<span class="badge badge-error">error</span>';

    tr.innerHTML =
      '<td class="time">' + fmtTime(frame.ts) + "</td>" +
      '<td class="conn" title="' + frame.connId + '">' + shorten(frame.connId, 18) + "</td>" +
      '<td class="dir">' + (frame.direction === "send" ? "→" : "←") + "</td>" +
      '<td class="session" title="' + frame.sessionId + '">' + shorten(frame.sessionId, 10) + "</td>" +
      '<td class="method-' + frame.kind + '">' + frame.label + badge + "</td>" +
      '<td class="payload">' + escapeHTML(shorten(frame.rawText, 500)) + "</td>";

    tr.addEventListener("click", function() { toggleDetails(tr, frame); });

    return tr;
  }

  function escapeHTML(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function toggleDetails(tr, frame) {
    if (tr.nextSibling && tr.nextSibling.classList && tr.nextSibling.classList.contains("details")) {
      tr.nextSibling.remove();
      return;
    }

    var details = document.createElement("tr");
    details.className = "details";

    var td = document.createElement("td");
    td.colSpan = 6;

    var actions = document.createElement("div");
    actions.className = "actions";

    if (frame.kind === "request") {
      var replay = document.createElement("button");
      replay.textContent = "copy to command panel";
      replay.addEventListener("click", function(e) {
        e.stopPropagation();
        el("cmd-conn").value = frame.connId;
        el("cmd-session").value = frame.sessionId || "";
        el("cmd-method").value = frame.message.method || "";
        el("cmd-params").value = frame.message.params ? JSON.stringify(frame.message.params, null, 2) : "";
      });
      actions.appendChild(replay);
    }

    var copy = document.createElement("button");
    copy.textContent = "copy JSON";
    copy.addEventListener("click", function(e) {
      e.stopPropagation();
      navigator.clipboard && navigator.clipboard.writeText(frame.rawText);
    });
    actions.appendChild(copy);

    var pre = document.createElement("pre");
    pre.textContent = JSON.stringify(frame.message, null, 2);

    td.appendChild(actions);
    td.appendChild(pre);
    details.appendChild(td);
    tr.after(details);
  }

  var shown = 0;

  function render() {
    framesBody.textContent = "";
    shown = 0;

    var fragment = document.createDocumentFragment();
    state.frames.forEach(function(frame, index) {
      if (matches(frame)) {
        fragment.appendChild(rowFor(frame, index));
        shown++;
      }
    });

    framesBody.appendChild(fragment);
    updateStatus();
    scroll();
  }

  function append(frame, index) {
    if (!matches(frame)) return;

    framesBody.appendChild(rowFor(frame, index));
    shown++;

    while (framesBody.children.length > MAX_FRAMES) {
      framesBody.removeChild(framesBody.firstChild);
    }

    updateStatus();
    scroll();
  }

  function scroll() {
    if (state.autoscroll) container.scrollTop = container.scrollHeight;
  }

  function updateStatus() {
    el("count").textContent = shown + " shown / " + state.frames.length + " captured";
  }

  function updateConnections() {
    var select = el("cmd-conn");
    var previous = select.value;
    select.textContent = "";

    if (state.conns.length === 0) {
      var opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "no active connections";
      select.appendChild(opt);
    } else {
      state.conns.forEach(function(conn) {
        var opt = document.createElement("option");
        opt.value = conn.id;
        opt.textContent = conn.id;
        opt.title = conn.endpoint;
        select.appendChild(opt);
      });

      if (state.conns.some(function(c) { return c.id === previous; })) {
        select.value = previous;
      }
    }

    el("conn-summary").textContent = state.conns.length === 0
      ? "no proxied connections"
      : state.conns.length + " proxied connection(s)";
  }

  var toastTimer = null;

  function toast(message) {
    var t = el("toast");
    t.textContent = message;
    t.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.style.display = "none"; }, 5000);
  }

  var ws = null;

  function connect() {
    var scheme = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(scheme + location.host + "/ui/ws");

    ws.onopen = function() {
      el("status-dot").classList.add("connected");
      el("ws-status").textContent = "connected to proxy";
    };

    ws.onclose = function() {
      el("status-dot").classList.remove("connected");
      el("ws-status").textContent = "disconnected, retrying...";
      setTimeout(connect, 2000);
    };

    ws.onmessage = function(e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }

      if (msg.type === "frame") {
        var frame = prepare(msg);
        state.frames.push(frame);

        if (state.frames.length > MAX_FRAMES) {
          state.frames = state.frames.slice(-MAX_FRAMES);
          state.dirty = true;
        }

        if (state.paused) {
          state.dirty = true;
        } else if (state.dirty) {
          state.dirty = false;
          render();
        } else {
          append(frame, state.frames.length - 1);
        }
      } else if (msg.type === "connections") {
        state.conns = msg.connections || [];
        updateConnections();
      } else if (msg.type === "error") {
        toast(msg.message);
      }
    };
  }

  el("pause").addEventListener("click", function() {
    state.paused = !state.paused;
    this.classList.toggle("active", state.paused);
    this.textContent = state.paused ? "resume" : "pause";

    if (!state.paused && state.dirty) {
      state.dirty = false;
      render();
    }
  });

  el("clear").addEventListener("click", function() {
    state.frames = [];
    state.pending = {};
    state.dirty = false;
    render();
  });

  el("autoscroll").addEventListener("click", function() {
    state.autoscroll = !state.autoscroll;
    this.classList.toggle("active", state.autoscroll);
    scroll();
  });

  ["search", "include", "exclude"].forEach(function(id) {
    el(id).addEventListener("input", render);
  });

  ["show-requests", "show-responses", "show-events", "show-injected"].forEach(function(id) {
    el(id).addEventListener("change", render);
  });

  el("cmd-send").addEventListener("click", function() {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      toast("not connected to proxy");
      return;
    }

    var connId = el("cmd-conn").value;
    if (!connId) {
      toast("no proxied connection to send to");
      return;
    }

    var method = el("cmd-method").value.trim();
    if (!method) {
      toast("method is required");
      return;
    }

    var params;
    var raw = el("cmd-params").value.trim();
    if (raw) {
      try {
        params = JSON.parse(raw);
      } catch (err) {
        toast("params is not valid JSON: " + err.message);
        return;
      }
    }

    ws.send(JSON.stringify({
      type: "send",
      connId: connId,
      sessionId: el("cmd-session").value.trim(),
      method: method,
      params: params
    }));
  });

  el("cmd-params").addEventListener("keydown", function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") el("cmd-send").click();
  });

  updateConnections();
  updateStatus();
  connect();
})();
</script>
</body>
</html>
